# Blueprint da Render: cria o serviço web.
# A base de dados NÃO é criada aqui (a Render só permite 1 base gratuita por conta):
# usa-se uma base PostgreSQL já existente, através de DATABASE_URL.
# Render → New → Blueprint → escolhe este repositório.
services:
  - type: web
    name: projeto-serios
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DERIV_AFFILIATE_URL
        sync: false

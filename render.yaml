# Blueprint da Render: cria a base de dados PostgreSQL e o serviço web.
# Render → New → Blueprint → escolhe este repositório.
databases:
  - name: serios-db
    databaseName: serios
    user: serios
    plan: free

services:
  - type: web
    name: projeto-serios
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: serios-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DERIV_AFFILIATE_URL
        sync: false
